name: Validate wizard silence audio fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run wizard tests
        run: yarn test-ci src/views/Edit/Wizard/index.test.js
      - name: Build
        run: yarn build
        env:
          PUBLIC_URL: "./"
