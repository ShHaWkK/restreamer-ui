name: Validate silence audio fix

on:
  push:
    branches: [fix/silence-audio-source]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false src/views/Edit/Wizard/index.test.js
