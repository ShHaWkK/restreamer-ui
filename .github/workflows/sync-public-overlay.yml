name: Sync and validate public overlay

on:
  push:
    branches: [fix/public-overlay-videojs8]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-overlay-videojs8
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Sync bundled overlay from declared dependency
        run: |
          cp node_modules/videojs-overlay/dist/videojs-overlay.min.js public/_player/videojs/dist/videojs-overlay.min.js
          cp node_modules/videojs-overlay/dist/videojs-overlay.css public/_player/videojs/dist/videojs-overlay.min.css
      - run: yarn test --watchAll=false src/misc/Player/overlay-compat.test.js
      - run: yarn build
      - name: Commit synced assets
        run: |
          if git diff --quiet -- public/_player/videojs/dist/videojs-overlay.min.js public/_player/videojs/dist/videojs-overlay.min.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/_player/videojs/dist/videojs-overlay.min.js public/_player/videojs/dist/videojs-overlay.min.css
          git commit -m "fix: sync public videojs overlay assets"
          git push origin HEAD:fix/public-overlay-videojs8
