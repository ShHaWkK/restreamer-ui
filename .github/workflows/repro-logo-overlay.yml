name: Reproduce logo overlay

on:
  push:
    branches: [tmp/repro-logo-overlay]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false src/misc/Player/overlay-compat.test.js
