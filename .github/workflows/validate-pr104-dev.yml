name: Validate PR 104 on dev

on:
  push:
    branches: [tmp/validate-104-dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test-ci src/views/Edit/Wizard/index.test.js
